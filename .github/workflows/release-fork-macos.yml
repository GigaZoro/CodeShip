name: Release (fork) macOS
run-name: Release (fork) macOS v${{ inputs.version }}

# Builds the macOS arm64 app for a release that release-fork.yml published, and
# attaches it with its update feed. It runs apart from that workflow because
# GitHub runs short of hosted macOS runners for hours, and Windows and Linux do
# not need one. Until it attaches, the release carries the previous release's
# macOS feed, so Macs stay on that build. release-fork.yml starts it, and
# release-fork-retry.yml reruns it while its release is the latest. Both start
# it at the release's tag, so it runs the workflows and actions of the commit
# that release was built and reviewed from, never a later main. See
# "Releasing from a fork" in docs/operations/release.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The published release to attach the macOS app to, for example 2026.1113.13."
        required: true
        type: string
      bundle_run:
        description: "The Release (fork) run that built its JS bundle."
        required: true
        type: string

# A newer pending run replaces an older pending one: Macs only need the newest
# release. release-fork-retry.yml matches runs to releases by the run name.
concurrency:
  group: release-fork-macos
  cancel-in-progress: false

permissions:
  # The preflight copies the JS bundle from the release's own run.
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    steps:
      # An ad hoc signed Mac app cannot apply an update, so attaching one would
      # offer installed Macs an update that always fails.
      - name: Require a macOS signing identity
        env:
          MACOS_SELF_SIGNED_CERTIFICATE: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE }}
          MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ ( -z "$MACOS_SELF_SIGNED_CERTIFICATE" || -z "$MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD" ) && ( -z "$CSC_LINK" || -z "$APPLE_API_KEY" ) ]]; then
            echo "::error::Add the MACOS_SELF_SIGNED_CERTIFICATE and MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD secrets (see docs/operations/release.md)."
            exit 1
          fi

      - id: release
        name: Verify the release and its JS bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUNDLE_RUN: ${{ inputs.bundle_run }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$BUNDLE_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::Pass a version such as 2026.1113.13 and the numeric id of its Release (fork) run."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/v$VERSION" ]]; then
            echo "::error::Run this workflow at the release's tag (--ref v$VERSION), not $GITHUB_REF."
            exit 1
          fi
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")"
          sha="$(jq -er .target_commitish <<<"$release")"
          provenance="$(jq -r '(.body // "" | split("\n") | map(sub("\r$"; "") | select(length > 0)) | last // "")' <<<"$release")"
          if [[ ! "$provenance" =~ ^'<!-- codeship-bundle '([1-9][0-9]*)' '([1-9][0-9]*)' '([0-9a-f]{64})' -->'$ ]]; then
            echo "::error::v$VERSION has no recorded JS bundle."
            exit 1
          fi
          producer="${BASH_REMATCH[1]}"
          artifact_id="${BASH_REMATCH[2]}"
          digest="${BASH_REMATCH[3]}"
          if [[ "$BUNDLE_RUN" != "$producer" ]]; then
            echo "::error::v$VERSION records run $producer as its JS bundle producer, but got run $BUNDLE_RUN."
            exit 1
          fi

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ || "$tag_sha" != "$sha" || "$GITHUB_SHA" != "$sha" ]]; then
            echo "::error::v$VERSION was built from $sha, but its tag is at $tag_sha and this run is at $GITHUB_SHA."
            exit 1
          fi
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
            --jq '[.id, .name, .expired, .workflow_run.id, .workflow_run.head_sha, .digest] | join(" ")')"
          if [[ "$artifact" != "$artifact_id js-bundle false $producer $sha sha256:$digest" ]]; then
            echo "::error::Artifact $artifact_id is unavailable or does not match the JS bundle recorded for v$VERSION."
            exit 1
          fi

          archive="$RUNNER_TEMP/release-js-bundle.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
          checksum="$(sha256sum "$archive")"
          if [[ "${checksum%% *}" != "$digest" ]]; then
            echo "::error::The downloaded JS bundle does not match the recorded SHA-256 digest."
            exit 1
          fi
          if [[ "$(unzip -p "$archive" bundle-version.txt)" != "$VERSION" ]]; then
            echo "::error::The recorded JS bundle does not contain version $VERSION."
            exit 1
          fi
          unzip -q "$archive" -d "$RUNNER_TEMP/js-bundle"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.release.outputs.sha }}
          sparse-checkout: |
            /.env.example
            /.github/scripts/fork-release.cjs
          sparse-checkout-cone-mode: false

      - id: public_config
        name: Read public T3 Connect configuration
        run: |
          set -euo pipefail
          node .github/scripts/fork-release.cjs public-config > "$RUNNER_TEMP/public-config"
          cat "$RUNNER_TEMP/public-config" >> "$GITHUB_OUTPUT"

      # release-desktop.yml reads the verified bundle from its own run.
      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: ${{ runner.temp }}/js-bundle/
          if-no-files-found: error
          retention-days: 3

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      ref: ${{ needs.preflight.outputs.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: macOS arm64
      # The macOS version upstream's release.yml builds on.
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      launch_check: true
      timeout_minutes: 60

  attach:
    name: Attach to the release
    needs: [desktop_mac_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-mac-arm64
          path: release-assets

      # latest-mac.yml replaces the carried feed last, so a Mac never reads a
      # feed whose files are not there yet.
      - name: Attach the app, then its update feed
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          rm -f builder-debug.yml
          ls -la
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.dmg ./*.zip ./*.blockmap
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber latest-mac.yml
