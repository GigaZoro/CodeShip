name: Release (fork) retry

# GitHub-hosted macOS arm64 runners sometimes never pick up a job, so it is
# cancelled and the fork release is skipped. Rerun the failed jobs up to twice,
# keeping the run's bundle, finished platform builds, and reserved version. A run
# whose commit is no longer main is left alone: main's own run releases it, and
# publishing the older build afterwards would mark it latest.

on:
  workflow_run:
    workflows: [Release (fork)]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Retry failed release
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun failed jobs while the run still builds main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          if [[ "$head" != "$RUN_SHA" ]]; then
            echo "$DEFAULT_BRANCH moved to $head, whose own run releases it."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
