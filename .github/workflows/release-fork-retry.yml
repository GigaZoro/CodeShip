name: Release (fork) retry

# Fork releases fail for reasons outside the build: GitHub runs short of hosted
# runners for hours at a time, macOS ones above all, and GitHub outages make
# release downloads such as Electron's time out for hours. Rerun the failed jobs,
# keeping the run's bundle, finished builds, and reserved version. A run whose
# only failures are jobs GitHub never gave a runner reruns as soon as it ends,
# up to MAX_ATTEMPTS: each attempt waits out GitHub's queue (about 15 minutes)
# and uses no build time. Other failures rerun twice right away, then from the
# schedule, which GitHub delays by hours under load.
#
# Main publishes Windows and Linux. Each published tag owns its macOS build.
#
# Release (fork) publishes main's head for Windows and Linux. A run whose commit
# is no longer main is left alone: main's own run releases it, and publishing
# the older build afterwards would mark it latest. Release (fork) macOS then
# attaches the Mac app to that release. A run whose release is no longer the
# latest is left alone too: Macs update only to the latest release.

on:
  workflow_run:
    workflows: [Release (fork), Release (fork) macOS]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"

permissions:
  actions: write
  contents: read

env:
  MAX_ATTEMPTS: 24

jobs:
  retry:
    name: Retry failed release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.name == 'Release (fork)' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun failed jobs while the run still builds the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMMEDIATE_ATTEMPTS: 3
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          if [[ "$head" != "$RUN_SHA" ]]; then
            echo "$DEFAULT_BRANCH moved to $head, whose own run releases it."
            exit 0
          fi
          never_started="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")]
              | length > 0 and all((.runner_id // 0) == 0 and (.steps | length) == 0)')"
          limit="$IMMEDIATE_ATTEMPTS"
          if [[ "$never_started" == true ]]; then
            limit="$MAX_ATTEMPTS"
            echo "Attempt $RUN_ATTEMPT failed only because GitHub gave no runner to its failed jobs."
          fi
          if (( RUN_ATTEMPT >= limit )); then
            echo "Attempt $RUN_ATTEMPT reached the limit of $limit immediate reruns."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

  catch-up:
    name: Release main if its release failed
    if: github.event_name == 'schedule' && github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun or start the release of main's head
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled runs check out the default branch.
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          export HEAD_SHA="$head"
          released="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq 'any(.[]; (.draft | not) and .target_commitish == env.HEAD_SHA)')"
          if [[ "$released" == true ]]; then
            echo "$head is released."
            exit 0
          fi
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-fork.yml \
            --branch "$DEFAULT_BRANCH" --commit "$head" --limit 1 --json databaseId,status,conclusion,attempt \
            --jq '.[] | "\(.databaseId) \(.status) \(.attempt) \(.conclusion)"')"
          if [[ -z "$run" ]]; then
            # A fast-forward keeps its commits' old dates, so age the head by when main moved to it.
            read -r moved_to moved_at < <(gh api "repos/$GITHUB_REPOSITORY/activity?ref=refs/heads/$DEFAULT_BRANCH&per_page=1" \
              --jq '.[0] | "\(.after) \(.timestamp)"')
            if [[ "$moved_to" == "$head" ]]; then
              arrived="$moved_at"
            else
              arrived="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.committer.date)"
            fi
            if (( $(date +%s) - $(date -d "$arrived" +%s) < 600 )); then
              echo "$head is new; its push run may not have been created yet."
              exit 0
            fi
            echo "No release run for $head; starting one."
            gh workflow run release-fork.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
            exit 0
          fi
          read -r id status attempt conclusion <<<"$run"
          if [[ "$status" != completed ]]; then
            echo "Run $id for $head is $status."
            exit 0
          fi
          if [[ "$conclusion" == success ]]; then
            echo "::warning::Run $id for $head succeeded, but no release targets $head."
            exit 0
          fi
          if (( attempt >= MAX_ATTEMPTS )); then
            echo "::error::Run $id for $head ended $conclusion after $attempt attempts. Rerun it or push a fix."
            exit 1
          fi
          echo "Run $id for $head ended $conclusion after $attempt attempts; rerunning its failed jobs."
          gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY"

  catch-up-macos:
    name: Attach the macOS app to the latest release
    if: >-
      github.repository != 'pingdotgg/t3code' &&
      (github.event_name == 'schedule' ||
       (github.event.workflow_run.name == 'Release (fork) macOS' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    concurrency:
      group: retry-fork-macos
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: /.github/scripts/fork-release.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Rerun or start the macOS build of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          IMMEDIATE_ATTEMPTS: 3
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '"\(.tag_name) \(.target_commitish) \(.published_at) \(any(.assets[]; .name == "latest-mac.yml"))"')"
          read -r tag sha published has_feed <<<"$release"
          version="${tag#v}"
          export TITLE="Release (fork) macOS $tag"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]] &&
             [[ "$RUN_SHA" != "$sha" || ( "$RUN_TITLE" != "$TITLE" && "$RUN_TITLE" != "$TITLE (branch dispatch)" ) ]]; then
            echo "This failure belongs to a different release."
            exit 0
          fi
          # Until its own feed is attached, a release carries the previous one's.
          if [[ "$has_feed" == true ]]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest-mac.yml --dir "$RUNNER_TEMP/feed"
            if grep -Fxq "version: $version" "$RUNNER_TEMP/feed/latest-mac.yml"; then
              echo "$tag has its macOS app."
              exit 0
            fi
          fi
          bundle_run="$(node .github/scripts/fork-release.cjs macos-bundle "$tag" "$sha")"
          # Prefer an active build. For old tags GitHub does not expose dispatch inputs,
          # so a rejected bundle must be replaced by a fresh dispatch using the publisher.
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-fork-macos.yml --branch "$tag" --commit "$sha" --event workflow_dispatch --limit "$MAX_ATTEMPTS" \
            --json databaseId,status,conclusion,attempt,displayTitle \
            --jq '[.[] | select(.displayTitle == env.TITLE)] | (map(select(.status != "completed")) + map(select(.status == "completed")))[] | "\(.databaseId) \(.status) \(.attempt) \(.conclusion)"')"
          rejected=0
          while read -r id status attempt conclusion; do
            [[ -n "$id" ]] || break
            if [[ "$status" != completed || "$conclusion" == success ]]; then
              echo "Run $id for $tag is $status $conclusion."
              exit 0
            fi
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/attempts/$attempt/jobs?per_page=100")"
            if jq -e --arg download "Download the release's JS bundle" 'any(.jobs[].steps[]?;
              (.name == "Find the release and its JS bundle" or .name == $download) and .conclusion == "failure")' <<<"$jobs" >/dev/null; then
              rejected=$((rejected + 1))
              continue
            fi
            limit="$MAX_ATTEMPTS"
            if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
              [[ "$id" == "$RUN_ID" ]] || exit 0
              if ! jq -e '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")]
                | length > 0 and all((.runner_id // 0) == 0 and (.steps | length) == 0)' <<<"$jobs" >/dev/null; then
                limit="$IMMEDIATE_ATTEMPTS"
              fi
            fi
            if (( attempt >= limit )); then
              echo "Run $id reached $limit attempts for $tag."
              if (( attempt >= MAX_ATTEMPTS )); then exit 1; fi
              exit 0
            fi
            gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY"
            exit 0
          done <<<"$runs"
          if (( rejected >= MAX_ATTEMPTS )); then
            echo "::error::$tag exhausted its attempts to obtain the published bundle."
            exit 1
          fi
          if (( $(date +%s) - $(date -d "$published" +%s) < 600 )); then
            echo "Allowing the publisher time to dispatch the macOS build for $tag."
            exit 0
          fi
          gh workflow run release-fork-macos.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" \
            -f version="$version" -f bundle_run="$bundle_run"
