name: Release (fork) retry

# Fork releases fail for reasons outside the build: GitHub-hosted macOS arm64
# runners sometimes never pick up a job, and GitHub outages make release
# downloads such as Electron's time out for hours. Rerun the failed jobs, keeping
# the run's bundle, finished platform builds, and reserved version: twice right
# away, then every half hour until main is released. A run whose commit is no
# longer main is left alone: main's own run releases it, and publishing the
# older build afterwards would mark it latest.

on:
  workflow_run:
    workflows: [Release (fork)]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Retry failed release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun failed jobs while the run still builds main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          if [[ "$head" != "$RUN_SHA" ]]; then
            echo "$DEFAULT_BRANCH moved to $head, whose own run releases it."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

  catch-up:
    name: Release main if its release failed
    if: github.event_name == 'schedule' && github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun or start the release of main's head
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled runs check out the default branch.
          DEFAULT_BRANCH: ${{ github.ref_name }}
          MAX_ATTEMPTS: 24
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '.[] | select(.draft | not) | .target_commitish' | grep -qx "$head"; then
            echo "$head is released."
            exit 0
          fi
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-fork.yml \
            --commit "$head" --limit 1 --json databaseId,status,conclusion,attempt \
            --jq '.[] | "\(.databaseId) \(.status) \(.attempt) \(.conclusion)"')"
          if [[ -z "$run" ]]; then
            committed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.committer.date)"
            if (( $(date +%s) - $(date -d "$committed" +%s) < 600 )); then
              echo "$head is new; its push run may not have been created yet."
              exit 0
            fi
            echo "No release run for $head; starting one."
            gh workflow run release-fork.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
            exit 0
          fi
          read -r id status attempt conclusion <<<"$run"
          if [[ "$status" != completed ]]; then
            echo "Run $id for $head is $status."
            exit 0
          fi
          if [[ "$conclusion" == success ]]; then
            echo "::warning::Run $id for $head succeeded, but no release targets $head."
            exit 0
          fi
          if (( attempt >= MAX_ATTEMPTS )); then
            echo "::error::Run $id for $head ended $conclusion after $attempt attempts. Rerun it or push a fix."
            exit 1
          fi
          echo "Run $id for $head ended $conclusion after $attempt attempts; rerunning its failed jobs."
          gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY"
