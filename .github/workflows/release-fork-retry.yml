name: Release (fork) retry

# Fork releases fail for reasons outside the build: GitHub runs short of hosted
# runners for hours at a time, macOS ones above all, and GitHub outages make
# release downloads such as Electron's time out for hours. Rerun the failed jobs,
# keeping the run's bundle, finished builds, and reserved version. A run whose
# only failures are jobs GitHub never gave a runner reruns as soon as it ends,
# up to MAX_ATTEMPTS: each attempt waits out GitHub's queue (about 15 minutes)
# and uses no build time. Other failures rerun twice right away, then from the
# schedule, which GitHub delays by hours under load.
#
# Release (fork) publishes main's head for Windows and Linux. A run whose commit
# is no longer main is left alone: main's own run releases it, and publishing
# the older build afterwards would mark it latest. Release (fork) macOS then
# attaches the Mac app to that release. A run whose release is no longer the
# latest is left alone too: Macs update only to the latest release.

on:
  workflow_run:
    workflows: [Release (fork), Release (fork) macOS]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"

permissions:
  actions: write
  contents: read

env:
  MAX_ATTEMPTS: 24

jobs:
  retry:
    name: Retry failed release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun failed jobs while the run still builds the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMMEDIATE_ATTEMPTS: 3
        run: |
          set -euo pipefail
          if [[ "$RUN_WORKFLOW" == "Release (fork) macOS" ]]; then
            latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            if [[ "$RUN_TITLE" != "Release (fork) macOS $latest" ]]; then
              echo "$latest is the latest release now, and its own run builds its macOS app."
              exit 0
            fi
          else
            head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
            if [[ "$head" != "$RUN_SHA" ]]; then
              echo "$DEFAULT_BRANCH moved to $head, whose own run releases it."
              exit 0
            fi
          fi
          never_started="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")]
              | length > 0 and all((.runner_id // 0) == 0 and (.steps | length) == 0)')"
          limit="$IMMEDIATE_ATTEMPTS"
          if [[ "$never_started" == true ]]; then
            limit="$MAX_ATTEMPTS"
            echo "Attempt $RUN_ATTEMPT failed only because GitHub gave no runner to its failed jobs."
          fi
          if (( RUN_ATTEMPT >= limit )); then
            echo "Attempt $RUN_ATTEMPT reached the limit of $limit immediate reruns."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

  catch-up:
    name: Release main if its release failed
    if: github.event_name == 'schedule' && github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun or start the release of main's head
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled runs check out the default branch.
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          export HEAD_SHA="$head"
          released="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq 'any(.[]; (.draft | not) and .target_commitish == env.HEAD_SHA)')"
          if [[ "$released" == true ]]; then
            echo "$head is released."
            exit 0
          fi
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-fork.yml \
            --commit "$head" --limit 1 --json databaseId,status,conclusion,attempt \
            --jq '.[] | "\(.databaseId) \(.status) \(.attempt) \(.conclusion)"')"
          if [[ -z "$run" ]]; then
            committed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.committer.date)"
            if (( $(date +%s) - $(date -d "$committed" +%s) < 600 )); then
              echo "$head is new; its push run may not have been created yet."
              exit 0
            fi
            echo "No release run for $head; starting one."
            gh workflow run release-fork.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
            exit 0
          fi
          read -r id status attempt conclusion <<<"$run"
          if [[ "$status" != completed ]]; then
            echo "Run $id for $head is $status."
            exit 0
          fi
          if [[ "$conclusion" == success ]]; then
            echo "::warning::Run $id for $head succeeded, but no release targets $head."
            exit 0
          fi
          if (( attempt >= MAX_ATTEMPTS )); then
            echo "::error::Run $id for $head ended $conclusion after $attempt attempts. Rerun it or push a fix."
            exit 1
          fi
          echo "Run $id for $head ended $conclusion after $attempt attempts; rerunning its failed jobs."
          gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY"

  catch-up-macos:
    name: Attach the macOS app to the latest release
    if: github.event_name == 'schedule' && github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun or start the macOS build of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '"\(.tag_name) \(.target_commitish) \(.published_at) \(any(.assets[]; .name == "latest-mac.yml"))"')"
          read -r tag sha published has_feed <<<"$release"
          version="${tag#v}"
          # Until its own feed is attached, a release carries the previous one's.
          if [[ "$has_feed" == true ]]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest-mac.yml --dir "$RUNNER_TEMP/feed"
            if grep -Fxq "version: $version" "$RUNNER_TEMP/feed/latest-mac.yml"; then
              echo "$tag has its macOS app."
              exit 0
            fi
          fi
          export TITLE="Release (fork) macOS $tag"
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-fork-macos.yml --limit 20 \
            --json databaseId,status,conclusion,attempt,displayTitle \
            --jq 'first(.[] | select(.displayTitle == env.TITLE)) | "\(.databaseId) \(.status) \(.attempt) \(.conclusion)"')"
          if [[ -z "$run" ]]; then
            if (( $(date +%s) - $(date -d "$published" +%s) < 600 )); then
              echo "$tag is new; its release run may not have started its macOS build yet."
              exit 0
            fi
            bundle_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-fork.yml \
              --commit "$sha" --limit 1 --json databaseId --jq '.[].databaseId')"
            if [[ -z "$bundle_run" ]]; then
              echo "::error::No Release (fork) run built $sha, so $tag has no JS bundle for its macOS app."
              exit 1
            fi
            echo "No macOS build for $tag; starting one from run $bundle_run."
            gh workflow run release-fork-macos.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
              -f version="$version" -f bundle_run="$bundle_run"
            exit 0
          fi
          read -r id status attempt conclusion <<<"$run"
          if [[ "$status" != completed ]]; then
            echo "Run $id for $tag is $status."
            exit 0
          fi
          if [[ "$conclusion" == success ]]; then
            echo "::warning::Run $id for $tag succeeded, but $tag does not serve its own latest-mac.yml."
            exit 0
          fi
          if (( attempt >= MAX_ATTEMPTS )); then
            echo "::error::Run $id for $tag ended $conclusion after $attempt attempts. Rerun it or push a fix."
            exit 1
          fi
          echo "Run $id for $tag ended $conclusion after $attempt attempts; rerunning its failed jobs."
          gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY"
