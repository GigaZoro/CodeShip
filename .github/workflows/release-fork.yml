name: Release (fork)

# Publishes a fork's release, where release.yml cannot run: it needs the
# upstream Blacksmith runners, relay state, and npm and signing credentials.
# This builds Windows x64 on GitHub-hosted runners through the same
# release-desktop.yml, and publishes a GitHub Release with its updater manifest,
# so installed apps offer it through their update button. It also publishes the
# Linux x64 CLI archive, SHA256SUMS and install.sh, so a Linux server can
# install and update the fork's t3. release-fork-macos.yml then builds the
# macOS app and attaches it, because GitHub runs short of hosted macOS runners
# for hours. Every push to main releases; a manual run can pick the version.
# See "Releasing from a fork" in docs/operations/release.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 2026.1030.1. Empty uses today's date."
        required: false
        type: string

# A newer pending run replaces an older pending one, so a burst of pushes
# releases only the latest main, and runs never overlap on the version number.
concurrency:
  group: release-fork
  cancel-in-progress: false

permissions:
  # The Windows job reads this run's artifact list to wait for the Linux CLI
  # archive it embeds as the WSL runtime (see release-desktop.yml).
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    steps:
      - name: Require the default branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases build $DEFAULT_BRANCH. Run this workflow from $DEFAULT_BRANCH, not $REF_NAME."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /.env.example
            /docs/release-notes.md
            /.github/scripts/fork-release.cjs
            /.github/scripts/release-notes.cjs
          sparse-checkout-cone-mode: false

      - name: Require release notes for this shipment
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            node .github/scripts/release-notes.cjs check "$BEFORE"
          else
            node .github/scripts/release-notes.cjs check
          fi

      # Calendar versions (YEAR.MMDD.N) stay clear of upstream's 0.x tags, which
      # clones of a fork also fetch: a fork tag with an upstream tag's name makes
      # every later fetch fail with "would clobber existing tag".
      - id: version
        name: Resolve release version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [[ -z "$version" ]]; then
            prefix="$(date -u +%Y).$((10#$(date -u +%m%d)))"
            last="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$prefix." \
              --jq "[.[].ref | ltrimstr(\"refs/tags/v$prefix.\") | tonumber?] | max // 0")"
            version="$prefix.$((last + 1))"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 2026.1030.1, got '$version'."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "::error::Tag v$version already exists in $GITHUB_REPOSITORY."
            exit 1
          fi
          echo "Releasing $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same public T3 Connect identifiers development builds read. A fork
      # without them builds without T3 Connect.
      - id: public_config
        name: Read public T3 Connect configuration
        run: |
          set -euo pipefail
          node .github/scripts/fork-release.cjs public-config > "$RUNNER_TEMP/public-config"
          cat "$RUNNER_TEMP/public-config" >> "$GITHUB_OUTPUT"

  # The server bundle, web client, and Electron main, built once and packaged
  # by each platform job, as release.yml's build_bundle does.
  bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.preflight.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.preflight.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.preflight.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      # release-fork-macos.yml packages this bundle too, once GitHub has a macOS
      # runner for it, which can take hours.
      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

  # Runs for the Linux CLI archive: the Windows app embeds it as its WSL runtime
  # (the Windows job waits for a job named "Build Linux x64"), and the release
  # publishes it for Linux servers. Its Linux installers are not published, so
  # the release does not wait on them; the archive is uploaded before they build.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      timeout_minutes: 60

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      timeout_minutes: 100

  # Never waits for a macOS runner, which Windows and Linux do not need.
  # scripts/release-fork.test.ts checks that.
  release:
    name: Publish GitHub Release
    needs: [preflight, desktop_win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Starts release-fork-macos.yml.
      actions: write
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /docs/release-notes.md
            /.github/scripts/fork-release.cjs
            /.github/scripts/release-notes.cjs
            /scripts/install.sh
          sparse-checkout-cone-mode: false

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')
          if [[ -n "$previous" ]]; then
            node .github/scripts/release-notes.cjs render "$previous" > release-notes.md
          else
            node .github/scripts/release-notes.cjs render > release-notes.md
          fi

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-win-x64
          path: release-assets

      # The Windows job could not finish without this artifact, so it is here.
      - name: Download Linux x64 CLI archive
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: release-assets

      # install.sh, `t3 update` and Desktop-managed SSH verify the archive against this file.
      - name: Write CLI archive checksums
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "::error::No CLI archive was downloaded."
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # release-desktop.yml suffixes the Windows manifest with its arch so two
      # Windows arches cannot collide; electron-updater reads plain latest.yml.
      # builder-debug.yml is electron-builder's config dump, not a feed.
      # cliInstallCommand points servers at their own version's install.sh.
      - name: Prepare updater manifests and installer
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -f release-assets/builder-debug.yml
          for manifest in release-assets/*-win-x64.yml; do
            mv "$manifest" "${manifest%-win-x64.yml}.yml"
          done
          cp scripts/install.sh release-assets/install.sh

      # Macs read latest-mac.yml from the release marked latest and fail their
      # update check without it. Until release-fork-macos.yml attaches this
      # version's, carry the previous release's, so Macs stay on its build.
      - name: Carry the macOS update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq length)" == 0 ]]; then
            echo "The first release has no macOS update feed to carry."
          else
            read -r previous has_feed <<<"$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
              --jq '"\(.tag_name) \(any(.assets[]; .name == "latest-mac.yml"))"')"
            if [[ "$has_feed" == true ]]; then
              gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern latest-mac.yml --dir "$RUNNER_TEMP/previous-feed"
              node .github/scripts/fork-release.cjs carry-macos-feed "$previous" "$RUNNER_TEMP/previous-feed/latest-mac.yml" \
                > release-assets/latest-mac.yml
              cat release-assets/latest-mac.yml
            else
              echo "::warning::$previous has no latest-mac.yml, so Macs fail their update check until this release's macOS build is attached."
            fi
          fi
          ls -la release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: T3.CodeShip v${{ needs.preflight.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/t3-*.tar.gz
            release-assets/SHA256SUMS
            release-assets/install.sh
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Build the macOS app for this release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh workflow run release-fork-macos.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f version="$VERSION" -f bundle_run="$GITHUB_RUN_ID"
