          if (@($cases | Where-Object { $_.title -ceq 'reports a whole added cache subtree and rejects simultaneous edits to installed files' -and $_.status -eq 'passed' }).Count -ne 1 -or $testExit -ne 0) { throw "Native setup proof failed, exit $testExit" }
          Write-Output "Native setup proof cases passed: $($cases.Count - 2), 2 POSIX-only fixture(s) skipped"
      - name: Measure shared-file changes and workspace path handling
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'verify-shared-file.mjs'
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import os from 'node:os';
          import crypto from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const root=fs.mkdtempSync(path.join(os.tmpdir(),'6731-native-'));
          function put(name,data){fs.writeFileSync(path.join(root,name),data)}
          function emit(x){console.log('measurement '+JSON.stringify(x))}
          function fingerprint(file){return crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')}
          try {
            for(const [file,expose] of [['posix-worktree-metadata.ts',''],['windows-worktree-files.ts',''],['worktree-setup-proof.ts','export const scanModules = (root, modules, fs, path, crypto, staging, windows) => scan(root, modules, fs, path, crypto, staging, cacheNames, undefined, windows).modules;'],['install-worktree-dependencies.ts','export { relocateWindowsDependencyLinks, relocatePnpmState };']]){
              put(file,fs.readFileSync(path.join(process.cwd(),'scripts/lib',file),'utf8')+'\n'+expose+'\n');
            }
            put('package.json','{"type":"module"}');
            const {scanModules:scan}=await import(pathToFileURL(path.join(root,'worktree-setup-proof.ts')).href);
            const {relocateWindowsDependencyLinks,relocatePnpmState}=await import(pathToFileURL(path.join(root,'install-worktree-dependencies.ts')).href);
            const sleep=()=>Atomics.wait(new Int32Array(new SharedArrayBuffer(4)),0,0,30);
            for(const mode of ['control','link','unlink','changed-bytes']){
              const repo=path.join(root,'repo-'+mode),store=path.join(root,'store-'+mode),alias=path.join(root,'alias-'+mode);
              fs.mkdirSync(path.join(repo,'node_modules'),{recursive:true});fs.writeFileSync(store,Buffer.alloc(2*1024*1024,7));
              const file=path.join(repo,'node_modules','shared');fs.linkSync(store,file);
              if(mode==='unlink')fs.linkSync(store,alias);
              sleep();
              const before=fs.statSync(file,{bigint:true}), bytes=fingerprint(file);
              const initialDigest=scan(repo,['node_modules'],fs,path,crypto,undefined,true).node_modules;
              assert.match(initialDigest,/^[a-f0-9]{64}$/);let inside,once=false,error,digest;
              const observedFs={...fs,readSync(...args){
                const n=fs.readSync(...args);
                if(n&&!once){
                  once=true;sleep();
                  if(mode==='link')fs.linkSync(store,alias);
                  if(mode==='unlink')fs.unlinkSync(alias);
                  if(mode==='changed-bytes'){
                    const fd=fs.openSync(store,'r+');try{fs.writeSync(fd,Buffer.from([4]),0,1,Number(before.size)-1);}finally{fs.closeSync(fd);}
                  }
                  inside=fs.fstatSync(args[0],{bigint:true});
                }
                return n;
              }};
              try{digest=scan(repo,['node_modules'],observedFs,path,crypto,undefined,true)}catch(e){error=e.message}
              assert(once&&inside);
              const after=fs.statSync(file,{bigint:true});
              emit({scenario:mode,scanSucceeded:!!digest,error,identitySame:before.ino===inside.ino&&before.dev===inside.dev,sizeSame:before.size===inside.size,mtimeSame:before.mtimeNs===inside.mtimeNs,ctimeSameDuringRead:before.ctimeNs===inside.ctimeNs,ctimeSameAfterClose:before.ctimeNs===after.ctimeNs,bytesSame:bytes===fingerprint(file),nlinkBefore:String(before.nlink),nlinkAfter:String(after.nlink)});
              if(mode==='changed-bytes')assert(error || digest.node_modules!==initialDigest,'Edited bytes were accepted as the original contents');
              else assert.equal(digest?.node_modules,initialDigest,error || 'Benign sharing must preserve the original digest');
            }
            const stage=path.join(root,'CaseSensitiveSpelling'),work=path.join(root,'PublishedCheckout'),mod=path.join(stage,'node_modules');
            fs.mkdirSync(mod,{recursive:true});fs.mkdirSync(work);fs.writeFileSync(path.join(mod,'.modules.yaml'),JSON.stringify({virtualStoreDir:'.pnpm',nodeLinker:'isolated'}));
            const state=path.join(mod,'.pnpm-workspace-state-v1.json');
            for(const [kind,spelling] of [['same',stage],['case alias',path.join(root,'casesensitivespelling')]]){
              assert.equal(fs.statSync(spelling,{bigint:true}).ino,fs.statSync(stage,{bigint:true}).ino);
              fs.writeFileSync(state,JSON.stringify({projects:{[spelling]:{}},pnpmfiles:[path.join(spelling,'config.cjs')]}));
              const accepted=await relocatePnpmState(stage,work);const result=JSON.parse(fs.readFileSync(state));
              emit({scenario:'workspace state '+kind,accepted,projectKeyRelocated:Object.hasOwn(result.projects,work),pnpmfileRelocated:result.pnpmfiles[0]===path.join(work,'config.cjs')});
              assert(accepted && Object.hasOwn(result.projects,work) && result.pnpmfiles[0]===path.join(work,'config.cjs'),'The relocated pnpm state still points to the private stage');
            }
            const target=path.join(mod,'pkg');fs.mkdirSync(target);
            const link=path.join(mod,'dep');fs.symlinkSync(target,link,'junction');
            const drive=['Y:','X:','W:'].find(d=>!fs.existsSync(d+'\\'));
            assert(drive,'SUBST control requires a free drive letter');if(drive){
              const subst=path.join(process.env.SystemRoot,'System32','subst.exe');
              execFileSync(subst,[drive,root]);
              try{
                const other=path.join(drive+'\\',path.basename(stage));
                assert.equal(fs.statSync(other,{bigint:true}).ino,fs.statSync(stage,{bigint:true}).ino);
                const accepted=await relocateWindowsDependencyLinks(other,work,['node_modules']);
                emit({scenario:'junction from subst drive',accepted,nativeAndPresentedStageAgree:fs.realpathSync.native(other).toLowerCase()===other.toLowerCase(),linkPointsToPublishedTarget:fs.readlinkSync(link).toLowerCase()===path.join(work,'node_modules','pkg').toLowerCase()});
                const expected=accepted?path.join(work,'node_modules','pkg'):target;assert.equal(fs.readlinkSync(link).toLowerCase(),expected.toLowerCase());
              } finally{execFileSync(subst,[drive,'/D'])}
            }
          } finally{fs.rmSync(root,{recursive:true,force:true})}
          '@ | Set-Content -LiteralPath $probe -Encoding utf8NoBOM
          node $probe
          exit $LASTEXITCODE
