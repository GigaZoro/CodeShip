name: Windows check (fork)

# The pre-push gate runs check:changed only on the machine that pushes, so a
# change landed from macOS or Linux would otherwise never run its tests on
# Windows. This runs check:changed on Windows for every push to a fork's main,
# against the commit main was at before the push. GitHub-hosted runners cost
# nothing for a public repository; ci.yml runs the server shards on Windows.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check:changed on Windows
    if: github.repository != 'pingdotgg/t3code'
    runs-on: windows-2025
    # An upstream sync pushes hundreds of files at once.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # setup-vp's own cache restores a Linux-shaped store on Windows, which is
      # slower than no cache (see #7975). Cache pnpm's Windows store directly.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-tests-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: vp install

      - name: Ensure Electron runtime is installed
        run: vp run --filter "@t3tools/desktop" ensure:electron

      # check:changed installs Chromium itself when it runs web browser tests.
      - name: Check the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          CHECK_CHANGED_TIMEOUT: "3600"
        run: vp run check:changed $env:BEFORE
