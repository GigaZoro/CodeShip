name: Windows check (fork)
on:
  push:
    branches: [ci/ab6731-family-146cd3ab8222-ffd1ac12]
permissions:
  contents: read
jobs:
  native:
    name: Worktree release on NTFS
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Fetch the exact public source commit
        shell: pwsh
        run: |
          $sha = '146cd3ab822273a3734d56b9536e49a475fe39ed'
          git init .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git remote add origin https://github.com/GigaZoro/CodeShip.git
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git fetch --no-tags --no-recurse-submodules --depth=1 origin $sha
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @('/*', '!/.repos/') | git sparse-checkout set --no-cone --stdin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((git rev-parse HEAD) -ne $sha) { throw 'Unexpected source checkout' }
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Verify source and filesystem
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sha -ne '146cd3ab822273a3734d56b9536e49a475fe39ed') { throw 'Source commit mismatch' }
          $filesystem = [IO.DriveInfo]::new([IO.Path]::GetPathRoot([IO.Path]::GetTempPath())).DriveFormat
          Write-Output "Source $sha, temp filesystem $filesystem"
          if ($filesystem -ne 'NTFS') { throw 'The fixture requires native NTFS' }
          git --version
          node --version
          node --input-type=module -e "await import('./apps/server/src/orchestration-v2/taskResultReadEvidence.ts')"
          if ($LASTEXITCODE -ne 0) { throw 'Native task result evidence module failed to load' }
      - name: Install project dependencies
        run: vp install
      - name: Verify native Git, family ownership and provider follow-up
