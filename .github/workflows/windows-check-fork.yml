          $exit = $LASTEXITCODE
          if (!(Test-Path -LiteralPath $receipt)) { throw 'Missing native unit test results' }
          $cases = (Get-Content -Raw -LiteralPath $receipt | ConvertFrom-Json).testResults.assertionResults
          $passed = @($cases | Where-Object { $_.status -eq 'passed' })
          $passed | Select-Object title,status | Format-Table -Wrap
          $titleAliases = @{'singleton release resumes the claimant after an intact removal interruption' = 'singleton release resumes the claimant after an intact re…'; 'singleton release holds the claimant after a partial removal' = 'singleton release holds the claimant after a partial remo…'; 'singleton release holds the claimant while the original Windows checkout is staged' = 'singleton release holds the claimant while the original W…'; 'singleton release finishes a verified partial Windows setup release after its durable ref advances' = 'singleton release finishes a verified partial Windows set…'; 'singleton release preserves a changed dependency in a staged Windows setup release' = 'singleton release preserves a changed dependency in a sta…'; 'singleton release holds a staged Windows setup release after its durable ref is rewritten' = 'singleton release holds a staged Windows setup release af…'; 'singleton release holds an unrelated chat while removal is claimed' = 'singleton release holds an unrelated chat while removal i…'; 'singleton release recovers a missing checkout for its recorded owner' = 'singleton release recovers a missing checkout for its rec…'; 'singleton release recreates an unregistered Windows checkout with an empty removal stage' = 'singleton release recreates an unregistered Windows check…'; 'singleton release recovers a missing checkout while another Windows release is staged' = 'singleton release recovers a missing checkout while anoth…'; 'singleton release holds an unrelated chat at the missing path' = 'singleton release holds an unrelated chat at the missing …'; 'singleton release holds the former owner when a replacement occupies the path' = 'singleton release holds the former owner when a replaceme…'; 'singleton release allows the unrelated owner of a complete replacement' = 'singleton release allows the unrelated owner of a complet…'; 'singleton release holds an unrelated owner of a checkout without an index' = 'singleton release hol