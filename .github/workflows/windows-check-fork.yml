          foreach ($title in @("restores a released family checkout safely: setup pending for a new side chat", "restores a released family checkout safely: setup pending for an unrelated thread", "restores a released family checkout safely: setup pending in another repository", "restores a released family checkout safely: removal interrupted with a saved backup", "restores a released family checkout safely: removal interrupted with a missing saved file", "restores a released family checkout safely: removal interrupted with a missing saved root", "starts a new checkout at a released family's path only for its own project and branch", "keeps a family checkout hook pending on older Git and retains a real hook failure", "allocates a separate managed directory when a family release reserves the default path", 'preserves the recorded pull request base from CLI release through provider start: deleted branch', 'preserves the recorded pull request base from CLI release through provider start: owner recreated the branch', 'preserves the recorded pull request base from CLI release through provider start: legacy base setting', 'preserves the recorded pull request base from CLI release through provider start: singleton deleted branch', 'preserves the recorded pull request base from CLI release through provider start: singleton owner recreated the branch', 'preserves the recorded pull request base from CLI release through provider start: local base ref', 'preserves the recorded pull request base from CLI release through provider start: significant Unicode branch suffix', 'preserves the recorded pull request base from CLI release through provider start: significant Unicode base suffix', 'reconciles a claimed release after interruption (replaced parent)', 'reconciles a claimed release after interruption (registration remains)', 'reconciles a claimed release after interruption (branch moved)', 'reconciles a claimed release after interruption (removed by Git)', 'reconciles a claimed